services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: launch_tracker
      POSTGRES_USER: launch_tracker
      POSTGRES_PASSWORD: launch_tracker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launch_tracker -d launch_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
