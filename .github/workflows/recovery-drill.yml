name: Isolated PostgreSQL recovery drill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/recovery-drill.yml'
      - 'services/api/migrations/**'
      - 'services/api/app/models.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-drill.yml'
      - 'services/api/migrations/**'
      - 'services/api/app/models.py'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: launch_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: nrl_recovery_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launch_test -d nrl_recovery_source"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://launch_test:local_test_only@127.0.0.1:5432/nrl_recovery_source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./services/api
      - name: Build isolated source schema
        working-directory: services/api
        run: alembic upgrade head
      - name: Dump and restore fictional data only
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          backup="$RUNNER_TEMP/recovery-fixture.dump"
          trap 'rm -f "$backup"' EXIT
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U launch_test -d nrl_recovery_source <<'SQL'
          INSERT INTO feedback (id,type,message,status,payload_digest,created_at,updated_at)
          VALUES ('00000000-0000-4000-8000-000000000001','opinion','Fictional recovery fixture','new','fixture',NOW(),NOW());
          SQL
          docker exec "$POSTGRES_CONTAINER" pg_dump -U launch_test -Fc nrl_recovery_source > "$backup"
          docker exec "$POSTGRES_CONTAINER" createdb -U launch_test nrl_recovery_target
          docker exec -i "$POSTGRES_CONTAINER" pg_restore --exit-on-error --no-owner -U launch_test -d nrl_recovery_target < "$backup"
          result=$(docker exec "$POSTGRES_CONTAINER" psql -At -U launch_test -d nrl_recovery_target -c "SELECT count(*)=1 AND bool_and(message='Fictional recovery fixture' AND status='new' AND name IS NULL AND email IS NULL) FROM feedback;")
          test "$result" = 't'
          source_version=$(docker exec "$POSTGRES_CONTAINER" psql -At -U launch_test -d nrl_recovery_source -c 'SELECT version_num FROM alembic_version;')
          restored_version=$(docker exec "$POSTGRES_CONTAINER" psql -At -U launch_test -d nrl_recovery_target -c 'SELECT version_num FROM alembic_version;')
          test -n "$source_version"
          test "$source_version" = "$restored_version"
          echo 'PASS isolated dump/restore: schema and fictional feedback preserved'
