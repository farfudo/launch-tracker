name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL migrations and synchronization
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: launch_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: launch_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launch_test -d launch_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: sqlite://
      POSTGRES_TEST_URL: postgresql+psycopg://launch_test:local_test_only@127.0.0.1:5432/launch_tracker_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check app tests tests_postgres
      - run: python -m pytest tests_postgres -q

  worker:
    name: Worker synchronization tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test infra/cloudflare/sync-worker.test.mjs

  api:
    name: API quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Check code style
        run: ruff check app tests

      - name: Run tests
        run: pytest

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Temporary isolated validation only; do not merge this workflow diff.
      - name: Check web code style
        run: npm run lint

      - name: Run A05 regression tests
        run: npx vitest run tests/freshness.test.tsx tests/cache-notice.test.tsx tests/cached-api.test.ts --maxWorkers=1

      - name: Run tests
        run: npm run test

      - name: Build production application
        run: npm run build

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Run A05 failed global status journeys
        run: FIXTURE_STATUS_FAILURE=true npm run test:e2e -- e2e/freshness.spec.ts --grep 'global failure' --retries=0 --output=test-results-a05-failure

      - name: Run A05 observation journeys
        run: npm run test:e2e -- e2e/freshness.spec.ts --grep 'observation stays' --retries=0 --output=test-results-a05-observation

      - name: Run isolated browser journeys
        run: npm run test:e2e -- --retries=0

      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/test-results-a05-failure/
            apps/web/test-results-a05-observation/
          retention-days: 7
