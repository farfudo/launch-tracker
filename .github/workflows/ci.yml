name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL migrations and synchronization
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: launch_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: launch_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launch_test -d launch_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: sqlite://
      POSTGRES_TEST_URL: postgresql+psycopg://launch_test:local_test_only@127.0.0.1:5432/launch_tracker_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check app tests tests_postgres
      - run: python -m pytest tests_postgres -q

  worker:
    name: Worker synchronization tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test infra/cloudflare/sync-worker.test.mjs

  api:
    name: API quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Check code style
        run: ruff check app tests

      - name: Run tests
        run: pytest

  # Temporary backend-only validation branch: API, PostgreSQL 17 and mocked Worker.
